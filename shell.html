<style>
/* ================================================================
   绘卷水浒 · 外壳（音乐之家）
   ----------------------------------------------------------------
   这一层永不卸载：背景音乐（audio/bgm.mp3）与右下角开关都住在它里面，
   书页 / 长卷 / 人物页在下面的 iframe 里来回切换。
   所以无论怎么翻页，音乐都不会中断、不会重头。

   入口：shell.html
   深链：shell.html#story.html?id=002   （可直接落到某一页）
   直接打开 index.html 也能看，只是那样会退回「切页需一次点按续上」的老方式；
   想要全程不断，请从这个外壳进。
   ================================================================ */
:root{ --gold:#c9a24b; --gold2:#e8ca7d; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0e0a06}
a{color:inherit;text-decoration:none}

/* 下面的内容层：整个窗口，页面各自在里面滚动 */
#view{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0e0a06}

/* ================================================================
   换页转场：一道淡淡古战场烟尘自左向右扫过，300ms 掠过、不遮字
   ================================================================ */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;visibility:hidden;overflow:hidden}
.curtain.on{visibility:visible}
.ct-sweep{position:absolute;top:-10vh;bottom:-10vh;left:0;width:52vw;opacity:0;will-change:transform,opacity;filter:blur(22px);
  background:
    radial-gradient(ellipse 60% 30% at 50% 18%,rgba(150,110,66,.5),transparent 70%),
    radial-gradient(ellipse 72% 36% at 46% 48%,rgba(130,94,56,.46),transparent 70%),
    radial-gradient(ellipse 60% 30% at 54% 82%,rgba(150,110,66,.5),transparent 70%)}
.curtain.go .ct-sweep{animation:ctSweep .3s ease-out forwards}
@keyframes ctSweep{0%{transform:translateX(-60vw);opacity:0}35%{opacity:.55}70%{opacity:.38}100%{transform:translateX(132vw);opacity:0}}
@media (prefers-reduced-motion:reduce){.curtain{display:none}}

/* 右下角浮标：全站唯一的音乐开关（盖在 iframe 之上，样式与各页一致） */
.bgm{position:fixed;right:20px;bottom:22px;z-index:120;display:flex;align-items:center;gap:10px;min-height:44px;
  padding:9px 17px;border:1px solid rgba(201,162,75,.5);border-radius:24px;cursor:pointer;
  background:rgba(14,10,6,.86);backdrop-filter:blur(8px);color:var(--gold2);
  font-family:'Noto Serif SC',serif;font-size:18px;letter-spacing:.16em;
  transition:border-color .35s,color .35s,transform .35s;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.bgm:hover{border-color:var(--gold);color:#fff3cd;transform:translateY(-2px)}
.bgm .bars{display:flex;align-items:flex-end;gap:2px;height:13px}
.bgm .bars i{width:2px;height:4px;background:currentColor;border-radius:1px}
.bgm.on .bars i{animation:bgmEq .9s ease-in-out infinite}
.bgm.on .bars i:nth-child(2){animation-delay:.18s}
.bgm.on .bars i:nth-child(3){animation-delay:.36s}
@keyframes bgmEq{0%,100%{height:3px}50%{height:13px}}
.bgm.off .bars{opacity:.35}
@media (max-width:880px){.bgm{right:14px;bottom:16px;padding:8px 14px;font-size:18px}}

/* ======== 自定义鼠标：黑芯白边 ======== */
html,body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='.6'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2333261a'/%3E%3Cstop%20offset='.55'%20stop-color='%23221809'/%3E%3Cstop%20offset='1'%20stop-color='%23120c05'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M11%2013.4%20L26.5%2028.5'%20stroke='%23241a0e'%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3Cpath%20d='M11%2013.4%20L26.5%2028.5'%20stroke='rgba(255,255,255,.35)'%20stroke-width='.8'%20stroke-linecap='round'/%3E%3Cpath%20d='M10.5%2011.5%20Q16%2012%2019%2016'%20stroke='%238e2a1c'%20stroke-width='1.8'%20fill='none'%20stroke-linecap='round'/%3E%3Cpath%20d='M9%2013%20Q14%2015%2015.5%2020'%20stroke='%238e2a1c'%20stroke-width='1.6'%20fill='none'%20stroke-linecap='round'/%3E%3Cpath%20d='M2%202%20Q10%204.5%2013.5%209%20L11.5%2014.5%20Q6.5%2011%202%202%20Z'%20fill=%22url(%23g)%22%20stroke='rgba(255,255,255,.55)'%20stroke-width='1.1'%20stroke-linejoin='round'/%3E%3C/svg%3E") 2 2,auto}
a,button,label,select,.chip,.bgm,.bar a.lnk,.bar button,.btn,.gal-card,.bt-item,.ep-card,.fl-card,.tl-item,.poi,.spider-node,.spider-close,.modal-close,.modal-nav button,.poi-close,.node,.star,#skyCanvas,[onclick]{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='.6'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2333261a'/%3E%3Cstop%20offset='.55'%20stop-color='%23221809'/%3E%3Cstop%20offset='1'%20stop-color='%23120c05'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M23.5%2020%20L28.5%2025'%20stroke='%23241a0e'%20stroke-width='3'%20stroke-linecap='round'/%3E%3Cpath%20d='M20.5%2021.5%20L25.5%2016.5'%20stroke=%22url(%23g)%22%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3Cpath%20d='M3%203%20Q14%205.5%2022.5%2013%20L25%2018.5%20Q14%2013.5%206.5%2010.5%20Z'%20fill=%22url(%23g)%22%20stroke='rgba(255,255,255,.55)'%20stroke-width='1.1'%20stroke-linejoin='round'/%3E%3C/svg%3E") 3 3,pointer !important}
input[type=text],input[type=search],textarea{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='.6'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2333261a'/%3E%3Cstop%20offset='.55'%20stop-color='%23221809'/%3E%3Cstop%20offset='1'%20stop-color='%23120c05'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M11.5%205%20h9%20M16%205%20v22%20M11.5%2027%20h9'%20stroke='rgba(255,255,255,.55)'%20stroke-width='3.6'%20stroke-linecap='round'/%3E%3Cpath%20d='M11.5%205%20h9%20M16%205%20v22%20M11.5%2027%20h9'%20stroke=%22url(%23g)%22%20stroke-width='2.2'%20stroke-linecap='round'/%3E%3C/svg%3E") 16 16,text}
</style>

<body>

<iframe id="view" src="index.html" allow="autoplay" title="绘卷水浒"></iframe>
<div class="curtain" id="veil" aria-hidden="true"><div class="ct-sweep"></div></div>

<script>
/* 深链：shell.html#story.html?id=002 → 直接把内容层开在那一页 */
(function(){
  var h = decodeURIComponent(location.hash.slice(1));
  if(h) document.getElementById('view').src = h;
})();
</script>
<script>
/* 换页转场 · 一道淡烟扫过
   点站内链接 / 同页锚点 / 新页载入时：一道淡淡古战场烟尘自左向右 300ms 扫过，
   透明度轻、不遮文字；跳转均立即进行，烟尘只做视觉点缀。 */
(function(){
  var view=document.getElementById('view'),curtain=document.getElementById('veil');
  if(!view||!curtain)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var first=true,swBusy=false;

  function sweep(){                                   /* 放一道烟 */
    if(swBusy)return;
    swBusy=true;
    curtain.classList.add('on');
    curtain.classList.remove('go');
    void curtain.offsetWidth;                         /* 重置动画以便连点也能重放 */
    curtain.classList.add('go');
    setTimeout(function(){curtain.classList.remove('on','go');swBusy=false;},340);
  }
  function hook(){
    var d=view.contentDocument; if(!d)return;
    d.addEventListener('click',function(e){
      var a=e.target.closest?e.target.closest('a[href]'):null;
      if(!a||a.target==='_blank')return;
      var href=a.getAttribute('href')||'';
      if(/\.html/i.test(href)){ sweep(); return; }    /* 跨页：不拦默认跳转，只放烟 */
      if(href.charAt(0)==='#'&&href.length>1&&d.getElementById(href.slice(1))){
        e.preventDefault();                           /* 同页锚点：拦下默认平滑滚动，瞬跳+放烟 */
        var el=d.getElementById(href.slice(1));
        var w=d.defaultView;
        w.scrollTo({top:el.getBoundingClientRect().top+w.scrollY-80,behavior:'instant'});
        try{d.defaultView.history.replaceState(null,'',href);}catch(_){}
        sweep();
      }
    },true);
  }
  view.addEventListener('load',function(){
    if(first){ first=false; hook(); return; }         /* 首次载入不加转场 */
    sweep(); hook();
  });
  hook();
})();
</script>
<script src="music.js"></script>
</body>
</html>
